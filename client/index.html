<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>리듬 탄막 게임</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<section id="screen-landing" class="screen">
  <div class="panel">
    <h1>리듬 탄막 게임</h1>
    <label>닉네임</label>
    <input id="nickname" maxlength="10" placeholder="닉네임을 입력하세요" />
    <button id="btn-create">방 만들기</button>
    <div id="room-list-section" style="margin-top: 20px; text-align: left;">
      <h3 style="margin-bottom: 8px;">현재 열려 있는 방 목록</h3>
      <div id="roomList" class="room-list"></div>
    </div>
    <p id="landing-error" class="error"></p>
  </div>
</section>

<section id="screen-lobby" class="screen hidden">
  <div class="panel wide">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 style="margin: 0;">방 코드: <span id="room-code-display"></span></h2>
      <button id="btn-leave-lobby" class="secondary" style="width: auto; margin: 0; padding: 6px 14px;">방 나가기</button>
    </div>
    <div id="player-list" class="player-list"></div>

    <div id="song-slots" class="song-slots"></div>

    <div class="row">
      <button id="btn-start" disabled>게임 시작</button>
    </div>
    <p id="lobby-error" class="error"></p>
  </div>
</section>

<section id="screen-game" class="screen hidden">
  <div class="game-layout">
    <!-- 좌측 조작법 패널 -->
    <div id="controls-panel" class="controls-panel">
      <h3>조작법 가이드</h3>
      <div class="control-item">
        <div class="key-group">
          <span class="key-cap">W</span>
          <div class="key-subgroup">
            <span class="key-cap">A</span><span class="key-cap">S</span><span class="key-cap">D</span>
          </div>
        </div>
        <span class="control-desc">방향 이동</span>
      </div>
      <div class="control-item">
        <div class="key-group">
          <span class="key-cap wide">SPACE</span>
        </div>
        <span class="control-desc">대시 (누른 시간에 비례)</span>
      </div>
      <div class="control-item">
        <div class="key-group">
          <span class="key-cap wide">SHIFT</span>
        </div>
        <span class="control-desc">고속 이동</span>
      </div>
      <div class="control-item">
        <span class="control-desc tip">💡 쓰러진 팀원 근접 시 4초 내 자동 부활!</span>
      </div>
      <button id="btn-leave-game" class="secondary leave-game-btn">방 나가기</button>
    </div>

    <!-- 인게임 메인 화면 -->
    <div class="game-main">
      <div class="hud">
        <div id="hud-stage"></div>
        <div id="hud-lives"></div>
        <div class="volume-control">
          <span>🔊</span>
          <input id="volume-slider" type="range" min="0" max="100" value="70" />
        </div>
      </div>
      <canvas id="game-canvas" width="1280" height="820"></canvas>
      <audio id="song-audio"></audio>
    </div>
  </div>
</section>

<section id="screen-result" class="screen hidden">
  <div class="panel wide">
    <h2 id="result-title"></h2>
    <p id="result-desc"></p>
    
    <div id="result-stats-container" class="stats-container"></div>

    <div class="result-actions">
      <!-- 방장(Host)에게만 노출되는 버튼들 -->
      <button id="btn-next-stage" class="hidden">다음 스테이지 시작</button>
      <button id="btn-restart" class="hidden">스테이지 재시작</button>
      <button id="btn-giveup" class="secondary hidden">처음으로 (로비로 돌아가기)</button>
      <!-- 일반 팀원에게 노출되는 대기 안내 문구 -->
      <p id="result-wait-msg" class="wait-msg hidden">방장의 선택을 기다리는 중...</p>
    </div>
  </div>
</section>

<script type="module" src="src/main.js"></script>
</body>
</html>
