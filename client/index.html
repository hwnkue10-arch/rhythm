<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>리듬 탄막 게임</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<section id="screen-landing" class="screen">
  <div class="panel">
    <h1>리듬 탄막 게임</h1>
    <label>닉네임</label>
    <input id="nickname" maxlength="10" placeholder="닉네임을 입력하세요" />
    <button id="btn-create">방 만들기</button>
    <div class="row">
      <input id="room-code-input" maxlength="6" placeholder="방 코드" style="text-transform:uppercase" />
      <button id="btn-join">참가하기</button>
    </div>
    <p id="landing-error" class="error"></p>
  </div>
</section>

<section id="screen-lobby" class="screen hidden">
  <div class="panel wide">
    <h2>방 코드: <span id="room-code-display"></span></h2>
    <div id="player-list" class="player-list"></div>

    <div id="song-slots" class="song-slots"></div>

    <div class="row">
      <button id="btn-start" disabled>게임 시작</button>
    </div>
    <p id="lobby-error" class="error"></p>
  </div>
</section>

<section id="screen-game" class="screen hidden">
  <div class="hud">
    <div id="hud-stage"></div>
    <div id="hud-lives"></div>
    <div class="volume-control">
      <span>🔊</span>
      <input id="volume-slider" type="range" min="0" max="100" value="70" />
    </div>
  </div>
  <canvas id="game-canvas" width="1280" height="820"></canvas>
  <audio id="song-audio"></audio>
</section>

<section id="screen-result" class="screen hidden">
  <div class="panel">
    <h2 id="result-title"></h2>
    <p id="result-desc"></p>
    <button id="btn-restart" class="hidden">스테이지 재시작</button>
    <button id="btn-next-stage" class="hidden">다음 스테이지</button>
    <button id="btn-giveup">처음으로 돌아가기</button>
  </div>
</section>

<script type="module" src="src/main.js"></script>
</body>
</html>
